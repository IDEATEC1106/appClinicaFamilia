name: Flutter CI & Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Configurar el SDK de Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. PRIMERO: Crear/regenerar la plataforma Android antes de tocar dependencias
      - name: Create Android platform
        run: flutter create . --org com.ideatec --platforms=android

      # 2. SEGUNDO: Instalar dependencias con la estructura ya creada
      - name: Install dependencies
        run: flutter pub get

      # 3. TERCERO: Compilar el APK en modo Release
      - name: Build APK Release
        run: flutter build apk --release

      # 4. CUARTO: Subir el APK como artefacto descargable
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
