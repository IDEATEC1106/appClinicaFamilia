name: Flutter CI & Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Configurar el SDK de Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Limpiar entorno
      - name: Clean Flutter project
        run: flutter clean

      # Instalar dependencias
      - name: Install dependencies
        run: flutter pub get

      # ¡ESTE ES EL PASO CLAVE! Regenerar la plataforma Android limpia automáticamente en el servidor
      - name: Create Android platform
        run: flutter create . --org com.ideatec --platforms=android

      # Compilar el APK en modo Release
      - name: Build APK Release
        run: flutter build apk --release

      # Subir el APK como artefacto descargable
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
