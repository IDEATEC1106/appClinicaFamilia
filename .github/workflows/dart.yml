name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Configurar el SDK de Flutter usando el canal estable (sin especificar versión estática)
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Instalar dependencias de Flutter
      - name: Install dependencies
        run: flutter pub get

      # Analizar código fuente en busca de errores
      - name: Analyze project source
        run: flutter analyze
