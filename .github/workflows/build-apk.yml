name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Setup Capacitor and Android Platform
      run: |
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
        
        # Creamos el archivo de configuración asegurando que el appId esté presente
        echo '{
          "appId": "com.ideatec.appclinica",
          "appName": "App Clinica Familia",
          "webDir": "build",
          "bundledWebRuntime": false
        }' > capacitor.config.json

        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
